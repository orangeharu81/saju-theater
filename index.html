<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #f8f4ee;
    margin: 0;
    padding: 40px 16px;
    color: #292724;
  }
  main {
    max-width: 420px;
    margin: auto;
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 8px 28px #0000000b;
  }
  h1 { text-align: center; margin-bottom: 8px; }
  .sub { text-align: center; color: #777; }
  label { display: block; margin: 20px 0 8px; }
  input, select, button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
  }
  input, select { border: 1px solid #ddd; }
  button {
    background: #333;
    color: white;
    border: 0;
    margin-top: 24px;
    cursor: pointer;
  }
  #result {
    margin-top: 24px;
    text-align: center;
    background: #f8f4ee;
    padding: 22px;
    border-radius: 16px;
  }
  .name { font-size: 28px; font-weight: 800; }
  .note { font-size: 12px; color: #777; }
 
/* SAJU THEATER V1.3 — Ticket UI */
#result.ticket-result {
  background: transparent;
  padding: 0;
}

.saju-ticket {
  overflow: hidden;
  background: #fffdf9;
  border: 1px solid #e7dfd9;
  border-radius: 18px;
  box-shadow: 0 12px 32px rgba(39, 24, 30, .08);
  text-align: center;
}

.ticket-head {
  padding: 22px 18px 18px;
}

.ticket-brand {
  font-size: 11px;
  letter-spacing: 2px;
  color: #80646e;
  font-weight: 700;
}

.ticket-title {
  margin: 9px 0 0;
  font-size: 25px;
  font-weight: 800;
  color: #29242a;
}

.ticket-main {
  background: #542c3e;
  color: #fff;
  padding: 30px 18px;
}

.ticket-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: #e1c6cf;
}

.ticket-nickname {
  margin: 16px 0;
  font-size: clamp(25px, 7vw, 34px);
  font-weight: 800;
  line-height: 1.3;
  word-break: keep-all;
}

.ticket-pillar {
  font-size: 14px;
  color: #eadce1;
}

.ticket-story {
  padding: 28px 22px;
  font-size: 16px;
  line-height: 1.85;
  font-weight: 500;
  color: #332d31;
  word-break: keep-all;
}

.ticket-stub {
  border-top: 1px dashed #c9b8be;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
}

.ticket-stub-label {
  font-size: 10px;
  letter-spacing: 1px;
  color: #91838a;
}

.ticket-number {
  margin-top: 5px;
  font-size: 23px;
  font-weight: 800;
  color: #542c3e;
}

.ticket-footer {
  padding: 0 18px 20px;
  font-size: 11px;
  color: #8e8187;
}

</style>

</main>

  const type = document.querySelector("#type");
  const leapLabel = document.querySelector("#leapLabel");
  const result = document.querySelector("#result");

  type.addEventListener("change", () => {
    leapLabel.hidden = type.value !== "lunar";

      const value = document.querySelector("#birth").value;

      if (!value) {
        result.textContent = "생년월일을 선택해 주세요.";
        return;
      }

      const [year, month, day] = value.split("-").map(Number);
      const isLunar = type.value === "lunar";
      const leap = document.querySelector("#leap").checked;

      const valid = isLunar
        ? calendar.setLunarDate(year, month, day, leap)
        : calendar.setSolarDate(year, month, day);

      if (!valid) {
        result.textContent = "지원하지 않거나 잘못된 날짜입니다.";
        return;
      }

      lunarInfo.month !== month ||
      lunarInfo.day !== day ||
      lunarInfo.intercalation !== true) {
